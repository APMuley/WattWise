version: "3.9"

services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./fastapi
    container_name: fastapi_backend
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - ./fastapi:/app
    ports:
      - "8000:8000"

volumes:
  postgres_data:
